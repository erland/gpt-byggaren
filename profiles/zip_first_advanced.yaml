id: zip_first_advanced
title: Advanced multi-runtime
description: Avancerad GPT med rik runtime, scripts och strukturerat workspace. Aktiverade runtimes härleds från canonical kontrakt och kan omfatta ChatGPT, Claude och agentiska runtimes.
runtime_selection:
  strategy: peer_candidates
  infer_from_canonical_contracts: true
  ask_user_only_for_business_constraints: true
  allow_multiple_default_targets: true
custom_gpt:
  enabled: true
  expected_parity: moderate_or_high
  role: peer_distribution
knowledge:
  level: rich_structured_runtime
scripts: expected
schemas: expected
templates: expected_when_reusable_outputs_exist
tests:
- deterministic
- contract
- build
- runtime_smoke
- behavioral
- regression
- reference
evals: extensive
ci: strongly_recommended
examples:
- projekt-ZIP-hantering
- ArchiMate-modellering
- kod- eller repositoryorienterad GPT
runtime_robustness:
  core_contract: required
  critical_behavior_in_canonical_instruction: true
  knowledge_required_for_core_behavior: false
  max_required_file_hops: 1
