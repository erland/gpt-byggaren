name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "work/**"
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-project:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          skip = {".git", "build", "dist", "__pycache__", ".pytest_cache"}
          files = [p for p in Path(".").rglob("*.py") if not any(part in skip for part in p.parts)]
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Python syntax OK: {len(files)} files")
          PY

      - name: Validate YAML and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          skip = {".git", "build", "dist", "__pycache__", ".pytest_cache"}
          for p in list(Path(".").rglob("*.yaml")) + list(Path(".").rglob("*.yml")):
              if not any(part in skip for part in p.parts):
                  yaml.safe_load(p.read_text(encoding="utf-8"))
          for p in Path(".").rglob("*.json"):
              if not any(part in skip for part in p.parts):
                  json.loads(p.read_text(encoding="utf-8"))
          PY

      - name: Run checkpoint project hygiene
        run: python scripts/project_hygiene.py --project-root . --mode checkpoint --fix

      - name: Run GPT linter
        run: python scripts/lint_gpt_project.py --project-root .

      - name: Validate model robustness contract
        run: python scripts/validate_model_robustness.py --project-root .

      - name: Validate instruction-adherence contract
        run: python scripts/validate_instruction_adherence.py --project-root .

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Build distributions
        run: |
          python scripts/build_distributions.py --project-root . --version 0.0.0-ci

      - name: Install TypeScript parser for generated OpenCode tools
        run: npm install --prefix /tmp/opencode-ts-parser --no-save typescript@5.9.3
      - name: Parse generated OpenCode TypeScript tools
        env:
          NODE_PATH: /tmp/opencode-ts-parser/node_modules
        run: node scripts/check_opencode_typescript.cjs build/opencode/.opencode/tools
      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root .

      - name: Verify expected build outputs
        run: python scripts/verify_distribution_outputs.py --project-root . --version 0.0.0-ci

      - name: Package canonical distribution engine
        run: python scripts/package_distribution_engine.py --version 0.0.0-ci

      - name: Verify canonical engine artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/gpt-byggaren-engine-0.0.0-ci.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path("dist/gpt-byggaren-engine-0.0.0-ci.zip")
          required = {
              "gpt-project.yaml",
              "scripts/install_distribution_engine.py",
              "scripts/build_distributions.py",
              "scripts/lib/project_model.py",
              "scripts/validate_distributions.py",
              "scripts/validate_portable_skills.py",
          }
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              missing = required - names
              assert not missing, f"Missing canonical engine files: {sorted(missing)}"
              assert z.testzip() is None, "Engine archive is corrupt"
          print(f"Verified {archive}")
          PY

      - name: Verify project hygiene
        shell: bash
        run: |
          set -euo pipefail
          BAD="$(find .             \( -path './.git' -o -path './build' -o -path './dist' \) -prune -o             \( -name '__pycache__' -o -name '.pytest_cache' -o -name '*.tmp' -o -name '*.temp' -o -name '.DS_Store' \)             -print)"
          if [ -n "$BAD" ]; then
            echo "Project hygiene check failed:"
            echo "$BAD"
            exit 1
          fi

      - name: Upload CI distributions and canonical engine
        uses: actions/upload-artifact@v4
        with:
          name: ci-distributions
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
