schema_version: 1
project:
  id: gpt-byggaren
  name: GPT Byggaren
  language: sv
  description: 'GPT Byggaren hjälper användare från idé till testad, paketerad och
    versionshanterad GPT med stöd för stegvis projektutveckling, Chat/ZIP-runtime,
    Custom GPT-distribution och GitHub CI och release som standard.

    '
development:
  plan: docs/development-plan.md
  status: project-status.yaml
  human_readable_status: STATUS.md
  status_schema: schemas/project-status.schema.json
  project_documentation:
  - PROJECT.md
  - docs/product-vision.md
  - docs/user-journeys.md
  - docs/canonical-project-structure.md
structure:
  canonical_root: src
  instructions:
    path: src/instructions
    required: true
  conversation_starters:
    path: src/conversation-starters
    required: true
  runtime_policy:
    path: src/runtime-policy
    required: false
  knowledge:
    path: knowledge
    required: false
  templates:
    path: templates
    required: false
  schemas:
    path: schemas
    required: false
  scripts:
    path: scripts
    required: false
  tests:
    path: tests
    required: false
  evals:
    path: evals
    required: false
  research:
    path: research
    required: false
  build:
    path: build
    generated: true
    create_when_needed: true
  dist:
    path: dist
    generated: true
    create_when_needed: true
runtime:
  primary: none
  chat_zip:
    enabled: true
    role: peer_distribution
    allow_richer_runtime_than_custom_gpt: true
    entrypoint: START-HERE.md
    schema: schemas/chat-zip-runtime.schema.json
    policy: src/runtime-policy/chat-zip-runtime-policy.md
    model: docs/chat-zip-runtime.md
    start_here_template: templates/START-HERE.chat.md.tpl
    layout:
      assistant: assistant
      knowledge: knowledge
      schemas: schemas
      scripts: scripts
      templates: templates
      runtime: runtime
    include:
      instructions:
      - src/instructions/system.md
      policies:
      - src/runtime-policy/*.md
      conversation_starters:
      - src/conversation-starters/**
      knowledge:
      - knowledge/**
      schemas:
      - schemas/**
      scripts:
      - scripts/**
      templates:
      - templates/**
    exclude:
    - docs/**
    - tests/**
    - evals/**
    - research/**
    - .github/**
    - .git/**
    - build/**
    - dist/**
    - project-status.yaml
    - PROJECT.md
    - STATUS.md
    manifest:
      required: true
      checksums: true
    deterministic_build: true
    omit_empty_runtime_directories: true
  claude:
    enabled: true
    role: peer_distribution
    mode: claude_project
    schema: schemas/claude-portable-runtime.schema.json
    policy: src/runtime-policy/claude-portable-runtime-policy.md
    model: docs/claude-portable-runtime.md
    project:
      instructions: project/instructions.md
      knowledge: project/knowledge
      runtime_contract: project/runtime-contract.json
    templates:
      readme: templates/README.claude.md.tpl
    validation:
      require_instructions: true
      require_runtime_contract: true
  opencode:
    enabled: true
    role: peer_distribution
    mode: opencode_workspace
    schema: schemas/opencode-runtime.schema.json
    policy: src/runtime-policy/opencode-runtime-policy.md
    model: docs/opencode-runtime.md
    layout:
      instructions: AGENTS.md
      config: opencode.json
      tools: .opencode/tools
      runtime_scripts: scripts
      runtime_contract: .opencode/runtime-contract.json
      knowledge: knowledge
    templates:
      readme: templates/README.opencode.md.tpl
    skills:
      enabled: true
      directory: .opencode/skills
      definitions:
      - id: gpt-project-workflow
        name: gpt-project-workflow
        description: Planera, återuppta och fortsätt ett GPT Byggaren-projekt utifrån faktisk projektstatus.
        references:
        - docs/dynamic-planning.md
        - docs/resume-flow.md
        - docs/next-step-recommendation.md
    validation:
      require_agents_md: true
      require_runtime_contract: true
  plugin:
    enabled: true
    role: peer_distribution
    mode: openai_plugin
  custom_gpt:
    enabled: true
    role: peer_distribution
    compilation_mode: adaptive
    allow_reduced_functionality: true
    platform_limits:
      instruction_max_characters: 8000
      knowledge_max_files: 20
    notes:
    - Platform limits are configuration values and must be easy to update.
    - Custom GPT and Chat ZIP are peer distribution targets derived from the same
      canonical contract.
    schema: schemas/custom-gpt-compilation.schema.json
    policy: src/runtime-policy/custom-gpt-compilation-policy.md
    model: docs/custom-gpt-compilation.md
    instruction:
      mode: compressed
      max_characters: 8000
    knowledge:
      strategy: hybrid
      max_files: 20
    builder:
      instructions: builder/instructions.md
      conversation_starters: builder/conversation-starters.md
      capabilities: builder/capabilities.md
      runtime_contract: builder/runtime-contract.json
      knowledge_package: builder/knowledge-package
    templates:
      readme: templates/README.custom-gpt.md.tpl
      compatibility: templates/COMPATIBILITY.md.tpl
      capabilities: templates/capabilities.md.tpl
    compatibility:
      report_required: true
      parity_symbols:
        equivalent: ✓
        reduced: '~'
        missing: '-'
    validation:
      block_on_instruction_limit: true
      block_on_knowledge_limit: true
      block_on_misleading_core_functionality: true
capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  recommendation_mode: inferred_from_use_case
  ask_user_only_when_business_choice_is_ambiguous: true
  requirements:
    web:
      level: to_be_recommended
    filesystem:
      read: required
      write: required
    shell:
      level: optional
    code_execution:
      level: recommended
    structured_data:
      level: required
    persistent_state:
      level: recommended
    external_tools:
      level: optional
      preferred_protocols:
      - mcp
    image_generation:
      level: to_be_recommended
  legacy_mapping:
    web: web
    data_analysis: code_execution
    file_handling: filesystem
    image_generation: image_generation
    structured_knowledge: structured_data
tools:
  contract_version: 1
  schema: schemas/tool-contract.schema.json
  tools:
  - id: lint-project
    type: script
    requirement: required
    purpose: Validera projektkontrakt, canonical instruktion och centrala projektregler.
    script: scripts/lint_gpt_project.py
    deterministic: true
    mutates_workspace: false
    working_directory: workspace
    runtime_fallback: block
  - id: recommend-next-step
    type: script
    requirement: required
    purpose: Härleda rekommenderat nästa steg från faktisk projektstatus.
    script: scripts/recommend_next_step.py
    deterministic: true
    mutates_workspace: false
    working_directory: workspace
    runtime_fallback: block
  - id: project-hygiene
    type: script
    requirement: required
    purpose: Kontrollera och vid uttryckligt fix-läge städa säkra genererade eller temporära projektfiler.
    script: scripts/project_hygiene.py
    deterministic: true
    mutates_workspace: true
    working_directory: workspace
    runtime_fallback: manual
  - id: build-distributions
    type: script
    requirement: required
    purpose: Bygga projekt- och runtimepaket deterministiskt.
    script: scripts/build_distributions.py
    deterministic: true
    mutates_workspace: true
    working_directory: workspace
    runtime_fallback: block
  - id: validate-distributions
    type: script
    requirement: required
    purpose: Validera byggda runtimepaket före leverans eller release.
    script: scripts/validate_distributions.py
    deterministic: true
    mutates_workspace: false
    working_directory: workspace
    runtime_fallback: block
analysis:
  model: docs/analysis-model.md
  recommendation_schema: schemas/analysis-recommendation.schema.json
  policy: src/runtime-policy/analysis-policy.md
  profiles:
  - simple
  - standard
  - zip_first_advanced
  - workflow_research_heavy
  infer_technical_choices_from_use_case: true
  ask_only_for_unresolved_business_choices: true
project_hygiene:
  enabled: true
  history_source: git
  remove_obsolete_work_files: true
  remove_temporary_files: true
  remove_caches: true
  remove_local_test_outputs: true
  avoid_duplicate_canonical_sources: true
  run_before_release: true
  model: docs/project-hygiene.md
  schema: schemas/project-hygiene.schema.json
  policy: src/runtime-policy/project-hygiene-policy.md
  classify_files: true
  safe_auto_remove_only: true
  review_when_uncertain: true
  validate_internal_references: true
  validate_distribution_contents: true
  final_hygiene_is_release_gate: true
  final_model: docs/final-project-hygiene.md
  final_policy: src/runtime-policy/final-hygiene-policy.md
  report_schema: schemas/project-hygiene-report.schema.json
  script: scripts/project_hygiene.py
  modes:
  - checkpoint
  - final
  final_is_release_gate: true
  safe_auto_clean:
  - build/**
  - dist/**
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
  - '**/.mypy_cache/**'
  - '**/.ruff_cache/**'
  - '**/*.tmp'
  - '**/*.temp'
  - '**/.DS_Store'
build:
  deterministic: true
  create_manifest: true
  create_checksums: true
  build_project_zip: true
  build_chat_zip: true
  build_custom_gpt_zip: true
  build_claude_zip: true
  build_opencode_zip: true
  build_plugin_zip: true
  direct_downloads_without_github: true
release:
  github:
    optional: false
    version_source: github_release_tag
    tag_pattern: v{semver}
    build_on_published_release: true
    workflow: .github/workflows/release.yml
    trigger: release.published
    permissions:
    - contents:write
    run_tests: true
    run_distribution_validation: true
    upload_artifacts_to_release: true
    artifacts:
    - project_zip
    - chat_zip
    - custom_gpt_zip_when_enabled
    - claude_zip_when_enabled
    - opencode_zip_when_enabled
    - plugin_zip_when_enabled
    - checksums
    - delivery_manifest
    policy: src/runtime-policy/github-release-policy.md
    model: docs/github-release-flow.md
    enabled: true
    default: true
  local:
    supported: true
    version_strategy_before_github_release: development_version
artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    development_plan:
      kind: document
      format: markdown
      requirement: required
      persistence: persistent
      multiplicity: one
      description: Stegvis utvecklingsplan som kan återanvändas mellan runtimes.
    project_package:
      kind: package
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: one
      filename_pattern: <project-id>-project.zip
      description: Komplett utvecklingsprojekt för fortsatt arbete och migrering.
    runtime_package:
      kind: distribution
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: many
      description: En eller flera runtime-specifika distributioner byggda från samma canonical projekt.
    validation_report:
      kind: report
      format: structured
      requirement: required
      persistence: persistent
      multiplicity: one
    parity_report:
      kind: report
      format: markdown
      requirement: conditional
      condition: multiple_runtimes
      persistence: persistent
      multiplicity: one
    checksums:
      kind: metadata
      format: sha256
      requirement: required
      persistence: persistent
      multiplicity: one
  legacy_mapping:
    project_zip: project_package
    chat_zip: runtime_package
    custom_gpt_zip: runtime_package
    claude_zip: runtime_package
    opencode_zip: runtime_package
    plugin_zip: runtime_package
    validation_report: validation_report
    parity_report: parity_report
    checksums: checksums
workspace_state:
  contract_version: 1
  schema: schemas/workspace-state-contract.schema.json
  workspace:
    requirement: required
    persistence: required
    portable: true
    separate_from_assistant: true
    artifact: project_package
    description: GPT-projektet som användaren utvecklar är ett portabelt workspace separat från GPT Byggarens runtimepaket.
  state:
    requirement: required
    persistence: required
    authority: workspace_file
    format: yaml
    path: project-status.yaml
    conversation_fallback: false
    description: Projektets maskinläsbara status är auktoritativ och ska göra fortsatt arbete oberoende av tidigare chatthistorik.
  runtime_preferences:
    chat: conversation_or_file
    agent: workspace_file
workflow:
  initial_analysis_in_chat: true
  development_plan_artifact: development_plan
  create_project_package_on_first_execution_step: true
  rebuild_complete_project_package_after_each_step: true
  recommend_next_step_from_actual_status: true
  resume_from_project_package: true
planning:
  mode: dynamic
  model: docs/dynamic-planning.md
  schema: schemas/development-plan.schema.json
  policy: src/runtime-policy/planning-policy.md
  derive_from_analysis: true
  persist_markdown_before_project_creation: true
  copy_into_project_on_first_execution_step: true
  allow_inserted_corrective_steps: true
  allow_step_merge: true
  allow_step_skip: true
  allow_step_split: true
  plan_is_guiding_not_mechanical: true
file_classification:
  classes:
  - CANONICAL
  - RUNTIME
  - DEVELOPMENT
  - GENERATED
  - TEMPORARY
  - HISTORICAL
  canonical_paths:
  - src/
  - knowledge/
  - templates/
  - schemas/
  development_paths:
  - docs/
  - tests/
  - evals/
  - research/
  - .github/
  generated_paths:
  - build/
  - dist/
instructions:
  architecture: docs/instruction-architecture.md
  schema: schemas/instruction-architecture.schema.json
  canonical: src/instructions/system.md
  policies:
    include:
    - src/runtime-policy/*.md
  compilation:
    chat:
      mode: full
    custom_gpt:
      mode: compressed
      max_characters_from: runtime.custom_gpt.platform_limits.instruction_max_characters
  single_source_of_truth: true
  distribution_specific_instructions_are_generated: true
  core_contract:
    enabled: true
    required_markers:
    - Analysera verksamhetsbehov före teknikval.
    - Bygg aktiverade runtime-distributioner från samma canonical kontrakt.
    - Knowledge beskriver referensmaterial och domäninformation.
    - Testa och validera efter varje relevant steg.
    - Rekommendera nästa steg från faktisk projektstatus.
    - När persistent state krävs ska chatthistorik inte vara enda sanningskälla.
    required_runtime_dependencies: []
    max_required_file_hops: 1
    knowledge_may_not_be_required_for_core_behavior: true
knowledge_architecture:
  model: docs/knowledge-architecture.md
  schema: schemas/knowledge-architecture.schema.json
  policy: src/runtime-policy/knowledge-policy.md
  canonical_root: knowledge
  chat:
    include:
    - knowledge/**
    full_canonical_allowed: true
  custom_gpt:
    strategy: hybrid
    max_files: 20
    allow_reduced_functionality: true
    priority:
    - knowledge/domain/**
    - knowledge/reference/core/**
  resource_metadata:
    supported: true
    fields:
    - id
    - title
    - role
    - source
    - runtime
    - priority
    - format
    - generated
  behavior_rules_belong_in_instructions_or_policy: true
platform_validation:
  model: docs/platform-validation.md
  schema: schemas/platform-validation.schema.json
  policy: src/runtime-policy/platform-validation-policy.md
  report_template: templates/custom-gpt-validation-report.md.tpl
  validate_built_distribution: true
  checks:
    instruction_length: true
    knowledge_file_count: true
    knowledge_file_size: when_configured
    knowledge_file_format: when_configured
    conversation_starters: true
    capabilities: true
    builder_package: true
    compatibility_report: true
    distribution_hygiene: true
  release_gate:
    pass: true
    warning: allowed_if_project_policy_accepts
    blocked: false
  same_rules_for_local_ci_and_release: true
runtime_parity:
  model: docs/runtime-parity.md
  schema: schemas/runtime-parity.schema.json
  policy: src/runtime-policy/runtime-parity-policy.md
  report_template: templates/runtime-parity-report.md.tpl
  reference:
    type: canonical_contract
  registered_runtimes:
  - chatgpt_chat
  - chatgpt_custom
  - claude_project
  - opencode
  compared_categories:
  - behavior
  - capability
  - artifact
  - workspace_state
  - tool
  levels:
  - full
  - high
  - moderate
  - low
  - not_viable
  states:
  - equivalent
  - reduced
  - missing
  - not_applicable
  criticality:
  - critical
  - important
  - optional
  weights:
    state:
      equivalent: 1.0
      reduced: 0.5
      missing: 0.0
    criticality:
      critical: 3
      important: 2
      optional: 1
  release_rules:
    full: publish
    high: publish
    moderate: publish_with_warning
    low: publish_with_warning
    not_viable: do_not_publish
  generate_separate_report_artifact: true
build_system:
  model: docs/build-system.md
  build_script: scripts/build_distributions.py
  validation_script: scripts/validate_distributions.py
  targets:
  - project
  - chat
  - custom-gpt
  - claude
  - opencode
  runtime_targets:
    chat:
      runtime_id: chatgpt_chat
      runtime_key: chat_zip
      builder: chat
      artifact_type: chat_zip
      filename_pattern: <project-id>-chat-<version>.zip
    custom-gpt:
      runtime_id: chatgpt_custom
      runtime_key: custom_gpt
      builder: custom_gpt
      artifact_type: custom_gpt_zip
      filename_pattern: <project-id>-custom-gpt-<version>.zip
    claude:
      runtime_id: claude_project
      runtime_key: claude
      builder: claude
      artifact_type: claude_zip
      filename_pattern: <project-id>-claude-<version>.zip
    opencode:
      runtime_id: opencode
      runtime_key: opencode
      builder: opencode
      artifact_type: opencode_zip
      filename_pattern: <project-id>-opencode-<version>.zip
  output_root: dist
  working_root: build
  deterministic_zip: true
  manifest: true
  checksums: sha256
  project_zip_excludes:
  - build/**
  - dist/**
  - .git/**
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
direct_build:
  model: docs/direct-build.md
  policy: src/runtime-policy/direct-build-policy.md
  script: scripts/build_direct.py
  delivery_manifest_schema: schemas/delivery-manifest.schema.json
  default_development_version: 0.0.0-dev
  github_required: false
  deliver:
  - project_zip
  - chat_zip
  - custom_gpt_zip_when_enabled
  - claude_zip_when_enabled
  - opencode_zip_when_enabled
  - checksums
  - delivery_manifest
  validate_before_delivery: true
ci:
  workflow: .github/workflows/ci.yml
  model: docs/ci-flow.md
  policy: src/runtime-policy/ci-policy.md
  triggers:
  - push
  - pull_request
  - workflow_dispatch
  development_version: 0.0.0-ci
  checks:
  - yaml_json_parse
  - tests
  - build_distributions
  - validate_distributions
  - expected_artifacts
  - project_hygiene
  upload_ci_artifacts: true
  same_toolchain_as_release: true
  enabled: true
  default: true
testing:
  model: docs/test-model.md
  policy: src/runtime-policy/test-policy.md
  manifest: test-manifest.yaml
  manifest_schema: schemas/test-manifest.schema.json
  eval_case_schema: schemas/eval-case.schema.json
  layers:
  - deterministic
  - contract
  - build
  - runtime_smoke
  - behavioral
  - regression
  - reference
  criticality:
  - critical
  - important
  - optional
  profiles:
    simple:
    - contract
    - build
    - behavioral_core
    standard:
    - deterministic
    - contract
    - build
    - runtime_smoke
    - behavioral
    zip_first_advanced:
    - deterministic
    - contract
    - build
    - runtime_smoke
    - behavioral
    - regression
    - reference
    workflow_research_heavy:
    - deterministic
    - contract
    - build
    - runtime_smoke
    - behavioral
    - regression
    - reference
  release_gate:
    critical_deterministic_tests_must_pass: true
    blocking_schemas_must_pass: true
    build_must_pass: true
    distribution_validation_must_pass: true
    critical_evals_must_meet_threshold: true
linting:
  model: docs/gpt-linter.md
  policy: src/runtime-policy/lint-policy.md
  script: scripts/lint_gpt_project.py
  report_schema: schemas/lint-report.schema.json
  severities:
  - error
  - warning
  - info
  errors_block_ci: true
  warnings_block_ci: false
  run_before_tests: true
next_step_recommendation:
  model: docs/next-step-recommendation.md
  policy: src/runtime-policy/next-step-policy.md
  schema: schemas/next-step-recommendation.schema.json
  script: scripts/recommend_next_step.py
  plan_is_guiding_not_mechanical: true
  allow_types:
  - planned
  - corrective
  - hygiene
  - validation
  - dependency
  - release
  - pause
  priority_order:
  - blockers
  - project_integrity
  - failed_validation
  - hygiene
  - corrective
  - dependency
  - planned
  - release_readiness
  allow_inserted_steps: true
  allow_skip: true
  allow_split: true
  allow_merge: true
  pause_only_for_unresolved_business_decision: true
resume:
  model: docs/resume-flow.md
  policy: src/runtime-policy/resume-policy.md
  schema: schemas/resume-result.schema.json
  script: scripts/resume_project.py
  supported: true
  requires_previous_chat_history: false
  read_order:
  - gpt-project.yaml
  - project-status.yaml
  - docs/development-plan.md
  - STATUS.md
  - PROJECT.md
  machine_status_is_authoritative: true
  verify_before_continue:
  - lint
  - next_step_recommendation
  legacy_mode: inventory_then_migrate
release_readiness:
  model: docs/release-readiness.md
  policy: src/runtime-policy/release-readiness-policy.md
  schema: schemas/release-readiness.schema.json
  script: scripts/assess_release_readiness.py
  report_template: templates/release-readiness.md.tpl
  results:
  - ready
  - ready_with_warnings
  - blocked
  blocked_stops_release: true
  same_assessment_for_local_and_github: true
new_project_experience:
  model: docs/new-project-experience.md
  runtime_strategy: peer_candidates
  infer_runtime_targets: true
  ask_user_only_for_business_constraints: true
  allow_multiple_default_targets: true
beginner_documentation:
  getting_started: docs/getting-started.md
  faq: docs/beginner-faq.md
  policy: src/runtime-policy/beginner-experience-policy.md
  target_audience: users_without_technical_gpt_build_knowledge
  technical_choices_inferred_when_possible: true
  project_zip_is_continuation_artifact: true
existing_project_migration:
  model: docs/existing-project-migration-experience.md
  policy: src/runtime-policy/existing-project-migration-policy.md
  script: scripts/migrate_project_for_runtime.py
  result_schema: schemas/existing-project-migration-result.schema.json
  natural_language_intent: true
  apply_safe_changes_when_explicitly_requested: true
  ask_only_for_unresolved_business_or_semantic_choices: true
  supported_targets:
  - opencode
legacy_migration:
  model: docs/legacy-migration-analysis.md
  script: scripts/migrate_legacy_project.py
  report_schema: schemas/legacy-migration-report.schema.json
  source_classes:
  - L0
  - L1
  - L2
  - L3
  confidence_levels:
  - safe_auto
  - auto_with_warning
  - manual_review
  - not_applicable
  preserve_domain_behavior: true
