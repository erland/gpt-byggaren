schema_version: 1
id: blank-idea-001
title: Från blank idé till distributionsbara artefakter
idea: Jag vill skapa en GPT som hjälper en projektledare att analysera mötesanteckningar,
  identifiera beslut, risker och aktiviteter samt skapa en strukturerad uppföljning.
features:
  moderate_workflow: true
  structured_knowledge: false
  repeatable_outputs: true
  scripts_required: false
  project_zip_manipulation: false
  research_heavy: false
  evidence_required: false
expected:
  profile: standard
  model_robustness_level: guided
  project_id: motesuppfoljaren
  runtime_strategy: peer_candidates
  default_runtime_ids:
  - chatgpt_chat
  - chatgpt_custom
  - claude_project
  non_default_runtime_ids:
  - opencode
  artifacts:
  - project_zip
  - chat_zip
  - custom_gpt_zip
  - claude_zip
  - delivery_manifest
  - checksums
