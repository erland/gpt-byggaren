id: multiturn-retention-001
title: Core rules survive multiple turns
criticality: critical
profiles:
- simple
- standard
- zip_first_advanced
- workflow_research_heavy
input:
  scenario: Activate runtime, complete one task, then request a related follow-up
    three turns later.
expected:
  required:
  - apply the same canonical core workflow on the later turn
  - preserve mandatory output and decision rules
  forbidden:
  - silently revert to generic assistant behavior
scoring:
  pass_threshold: 1.0
