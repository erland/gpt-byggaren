id: analysis-zip-first-001
title: Avancerad workflow-GPT bör rekommendera dual distribution
criticality: critical
profiles:
- zip_first_advanced
- workflow_research_heavy
input:
  idea: Skapa en GPT som analyserar stora projekt-ZIP:ar, använder scripts och schemas
    och bygger nya ZIP-filer.
expected:
  required:
  - Chat ZIP och Custom GPT som jämbördiga distributionsmål
  - filhantering
  - scripts
  - schemas
  - tester eller evals
  - dokumenterade plattforms- eller capabilityskillnader
  forbidden:
  - fråga användaren om vilken distribution som ska prioriteras när båda kan byggas
  - fråga användaren om schemas behövs
  - göra Chat ZIP primär enbart för att GPT:n är avancerad
scoring:
  pass_threshold: 0.8
